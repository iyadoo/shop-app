/* ===== v151 skins: modern (عصري فاتح) + sand (رملي دافئ) ===== */

html[data-skin=sand] body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .42 0 0 0 0 .3 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ===== v152: Excel-style tables ===== */
:root{--xg:color-mix(in srgb,var(--fg) 15%,transparent)}
:is(#main,#m) .xw{overflow:auto;max-height:72vh;border:1px solid var(--xg);border-radius:12px;background:var(--card);margin:8px 0}

:is(#main,#m) table.xl{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums;background:var(--card)}
:is(#main,#m) table.xl th,:is(#main,#m) table.xl td{border:0;border-left:1px solid var(--xg);border-bottom:1px solid var(--xg);padding:7px 10px;text-align:start;vertical-align:middle;line-height:1.35}
:is(#main,#m) table.xl tr>:last-child{border-left:0}

html[dir=ltr] :is(#main,#m) table.xl tr>:last-child{border-right:0}
#acr .kv{padding:8px 12px;margin:0;border:1px solid var(--xg);border-top:0;background:var(--card);font-variant-numeric:tabular-nums}
#acr h4+.kv{border-top:1px solid var(--xg);border-radius:10px 10px 0 0}
#acr .kv:nth-of-type(even){background:color-mix(in srgb,var(--fg) 3.5%,var(--card))}
#acr .kv:hover{background:color-mix(in srgb,var(--pri) 8%,var(--card))}
#acr .kv b{direction:ltr;font-variant-numeric:tabular-nums}
#acr .tot{padding:10px 12px;border:1px solid var(--xg);border-top:3px double color-mix(in srgb,var(--pri) 45%,transparent);background:color-mix(in srgb,var(--pri) 8%,var(--card));margin:0 0 6px;border-radius:0 0 10px 10px}
:is(#main,#m) table.xl tr.xh>th,:is(#main,#m) table.xl thead th{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--pri) 12%,var(--card));color:var(--fg);font-weight:700;font-size:12.5px;white-space:nowrap;border-bottom:2px solid color-mix(in srgb,var(--pri) 50%,transparent);padding:9px 10px}
:is(#main,#m) table.xl tbody tr:nth-child(even)>td{background:color-mix(in srgb,var(--fg) 3.5%,var(--card))}
:is(#main,#m) table.xl tr:hover>td{background:color-mix(in srgb,var(--pri) 9%,var(--card))}
:is(#main,#m) table.xl td.xn,:is(#main,#m) table.xl th.xn{text-align:left;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
:is(#main,#m) table.xl td.xneg{color:var(--bad);font-weight:600}
:is(#main,#m) table.xl tr.xt>*{position:static;color:var(--fg);background:color-mix(in srgb,var(--pri) 8%,var(--card));font-weight:800;border-top:3px double color-mix(in srgb,var(--pri) 45%,transparent);border-bottom:0;white-space:nowrap}
:is(#main,#m) table.xl td.nm,:is(#main,#m) table.xl td:not(.xn){min-width:60px}
:is(#main,#m) table.xl button{padding:4px 10px;font-size:12.5px}
:is(#main,#m) table.xl input,:is(#main,#m) table.xl select{margin:0;padding:6px 8px}
:is(#main,#m) .ptb tr.pw>td{background:color-mix(in srgb,var(--bad) 10%,var(--card))!important}
:is(#main,#m) .ptb tr.on>td{background:color-mix(in srgb,#16a34a 10%,var(--card))!important}
:is(#main,#m) table.xl tr.sel>td,:is(#main,#m) table.xl tr.act>td{background:color-mix(in srgb,var(--pri) 16%,var(--card))!important}

/* v154: POS invoice as table */
.lines .lh,.ln.lg{display:grid;grid-template-columns:minmax(0,1fr) 92px 78px 84px 30px;gap:6px;align-items:center}
.lines .lh{position:sticky;top:0;z-index:1;padding:8px 8px 7px;margin:0 0 2px;font-size:12px;font-weight:700;color:var(--mut);background:var(--card);border-bottom:2px solid color-mix(in srgb,var(--pri) 35%,transparent)}
.lines .lh>span:nth-child(2),.lines .lh>span:nth-child(3){text-align:center}
.lines .lh>span:nth-child(4){text-align:left}
.pr .ln.lg{padding:7px 8px;gap:6px}

const iD=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)),iNum=v=>{if(typeof v=='number')return v;const s=iD(v).trim().replace(/,/g,'.');return s===''?NaN:+s};
function iDate(v){let y,m,d;if(typeof v=='number'&&v>20000){const x=new Date(Math.round((v-25569)*86400000));y=x.getUTCFullYear();m=x.getUTCMonth()+1;d=x.getUTCDate()}else{const s=iD(v).trim();let r=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(r){y=+r[1];m=+r[2];d=+r[3]}else if(r=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/)){d=+r[1];m=+r[2];y=+r[3]}else return null}
const x=new Date(y,m-1,d);return x.getFullYear()==y&&x.getMonth()==m-1&&x.getDate()==d?[y,m,d]:null}

function impParse(k,rows){const C=IMP[k].c,err=[],G={};let st=0;if(rows.length&&isNaN(iNum(rows[0][C.no]))&&String(rows[0][C.no]).trim()!=='')st=1;

const PM={'كاش':'cash','نقد':'cash','نقدي':'cash','cash':'cash','فيزا':'visa','visa':'visa','cliq':'click','كليك':'click','دين':'debt','ذمم':'debt','debt':'debt'};
rows.forEach((r,ix)=>{if(ix<st||r.every(x=>String(x).trim()===''))return;if(k=='pur'&&String(r[C.q]).trim()===''&&String(r[C.p]).trim()==='')return;const ln=ix+1,bad=m=>err.push('سطر '+ln+': '+m);
const no=String(r[C.no]).trim();if(!no)return bad('رقم الفاتورة فارغ');const dd=iDate(r[C.date]);if(!dd)return bad('التاريخ غير صحيح');
let tm=[12,0],pay='cash';if(C.time!=null){tm=iTime(r[C.time]);if(!tm)return bad('الوقت غير صحيح')}
if(C.pay!=null){pay=PM[iD(r[C.pay]).trim().toLowerCase()];if(!pay)return bad('طريقة الدفع غير معروفة');if(k=='ret'&&pay!='cash'&&pay!='visa')return bad('المردود: كاش أو فيزا فقط')}
const it=find(r[C.code],r[C.name]);if(!it)return bad('المادة غير موجودة بالبرنامج ('+(r[C.name]||r[C.code])+')');
const q=iNum(r[C.q]),p=iNum(r[C.p]);if(!(q>0))return bad('الكمية غير صحيحة');if(isNaN(p)||p<0)return bad('السعر غير صحيح');
const cn=C.cn!=null?String(r[C.cn]).trim():'',ph=C.ph!=null?iD(r[C.ph]).replace(/\D/g,''):'';if(pay=='debt'&&!cn)return bad('الدين يتطلب اسم العميل');if(C.ph!=null&&String(r[C.ph]).trim()&&ph.length<5)return bad('رقم الهاتف غير صحيح');
const g=G[no]=G[no]||{no,ts:new Date(dd[0],dd[1]-1,dd[2],12,0).getTime()+Object.keys(G).length,pay,cn,ph,sup:C.sup!=null?String(r[C.sup]).trim():'',lines:[]};

const XT={date:['التاريخ'],no:['رقم الفاتورة'],typ:['الحركة'],pay:['طريقة الدفع'],name:['اسم المادة'],bc:['رمز الباركود','رمز المادة'],q:['الكمية'],p:['الافرادي'],net:['المجموع الصافي']},PMX={'نقدا':'كاش','بطاقة مصرفية':'فيزا'};
function xtParse(rows){const hi=rows.findIndex(r=>r.some(c=>String(c).trim()=='رقم الفاتورة')&&r.some(c=>String(c).trim()=='اسم المادة'));if(hi<0)return{err:'هذا ليس تقرير الحركة اليومية (لم أجد عمودي رقم الفاتورة واسم المادة)'};
const hd=rows[hi].map(c=>String(c).trim()),ix={};for(const k in XT){const j=hd.findIndex(h=>XT[k].includes(h));if(j>=0)ix[k]=j}
for(const k of ['date','no','typ','name','bc','q','p'])if(ix[k]===undefined)return{err:'عمود ناقص بالتقرير: '+XT[k][0]};
const S=[],R=[],P=[],bad=[],it={};let cur=null;const nn=v=>{const x=parseFloat(String(v).replace(/,/g,''));return isNaN(x)?null:x};
for(let n=hi+1;n<rows.length;n++){const r=rows[n],g=k=>ix[k]===undefined?'':String(r[ix[k]]==null?'':r[ix[k]]).trim();if(!r.some(c=>String(c).trim()!==''))continue;
if(g('no')!==''){const m=g('date').match(/(\d{1,2})-(\d{1,2})-(\d{4})/),t=g('typ'),kind=t.includes('مردود')?'ret':t.includes('مشتريات')?'pur':t.includes('مبيعات')?'sal':'';if(!m||!kind){bad.push('سطر '+(n+1)+': '+(!m?'تاريخ غير مفهوم':'نوع حركة غير معروف ('+t+')'));cur=null;continue}const pay=g('pay');cur={kind,no:g('no'),date:m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'),pay:PMX[pay]||pay};continue}
const name=g('name');if(!name||!cur)continue;const q=nn(g('q')),p=nn(g('p')),net=ix.net===undefined?null:nn(g('net')),bc=g('bc')||name;if(!(q>0)||p==null){bad.push('سطر '+(n+1)+': كمية أو سعر غير صحيح');continue}
const D4=cur.kind=='pur'?1e4:CP;let u=p;if(net!=null&&Math.abs(p*q-net)>0.005)u=Math.round(net/q*D4)/D4;
(cur.kind=='pur'?P:cur.kind=='ret'?R:S).push(cur.kind=='pur'?[cur.no,cur.date,'مورد غير محدد',bc,name,q,u]:cur.kind=='ret'?[cur.no,cur.date,cur.pay,bc,name,q,u]:[cur.no,cur.date,cur.pay,'','',bc,name,q,u]);
const o=it[bc]=it[bc]||{bc,name,price:null};o.name=name;if(cur.kind=='sal')o.price=p}
return{S,R,P,bad,items:Object.values(it)}}
const xtLet=x=>/^[A-Za-z]/.test(x.bc)?x.bc[0].toUpperCase():'';
function xtDo(rows){const r=xtParse(rows);if(r.err)return toast(r.err);const m=$('#m');const ex={sal:new Set(),ret:new Set(),pur:new Set()};Object.values(D.invs).forEach(i=>{if(i.imp&&i.ino!=null)(i.ret?ex.ret:ex.sal).add(String(i.ino))});Object.values(D.purchases).forEach(p=>{if(p.imp&&p.ino!=null)ex.pur.add(String(p.ino))});let skip=0;for(const [k,a] of [['sal','S'],['ret','R'],['pur','P']]){const b0=new Set(r[a].map(x=>x[0])).size;r[a]=r[a].filter(x=>!ex[k].has(String(x[0])));skip+=b0-new Set(r[a].map(x=>x[0])).size}if(!r.S.length&&!r.R.length&&!r.P.length)return toast('كل فواتير هذا التقرير مستوردة سابقاً ('+skip+' فاتورة) — لا يوجد جديد');
const cid={};Object.entries(D.cats).forEach(([id,c])=>{if(String(c.code||'').trim())cid[String(c.code).trim().toUpperCase()]=id});
const nw=r.items.filter(x=>!xFind({code:x.bc,name:x.name})),need=[...new Set(nw.map(xtLet).filter(c=>c&&!cid[c]))].sort(),unk=nw.filter(x=>!xtLet(x)),tl=a=>a.reduce((s,x)=>s+x[x.length-2]*x[x.length-1],0),cn=a=>new Set(a.map(x=>x[0])).size;
const opts=[...new Set([...Object.keys(cid),...need])].sort();
m.innerHTML=`<div class=box><h3>استيراد الحركة اليومية الشامل</h3><div class=kv><span>مبيعات</span><b>${cn(r.S)} فاتورة — ${M(tl(r.S))} ${CUR}</b></div><div class=kv><span>مردودات</span><b>${cn(r.R)} فاتورة — ${M(tl(r.R))} ${CUR}</b></div><div class=kv><span>مشتريات</span><b>${cn(r.P)} فاتورة — ${M(tl(r.P))} ${CUR}</b></div><div class=kv><span>مواد</span><b>${nw.length} جديدة، ${r.items.length-nw.length} موجودة</b></div>${need.length?`<p class=mut>سيتم إنشاء أصناف ناقصة تلقائياً: ${need.join('، ')} (باسم «صنف X» وتقدر تعدّل الاسم لاحقاً).</p>`:''}${unk.length?`<p class=mut>${unk.length} مادة بدون حرف صنف بالباركود (مثل: ${e(unk[0].name)}). اختر صنفها:</p><select id=xtu style="width:100%;padding:8px;border-radius:10px;font:inherit">${opts.map(c=>`<option>${e(c)}</option>`).join('')}</select>`:''}${r.bad.length?`<p class=mut>تم تجاهل ${r.bad.length} سطر غير صالح (${e(r.bad.slice(0,3).join('، '))})</p>`:''}${skip?`<p class=mut>تم تجاهل ${skip} فاتورة مستوردة سابقاً (لن تتكرر).</p>`:''}<p class=mut>الفواتير ستأخذ أرقاماً جديدة متسلسلة حسب التاريخ، وتُرقَّم المواد حسب الصنف ثم الاسم. قد تستغرق العملية دقيقة.</p><div class=row><button class=pri id=ok>استيراد الكل</button><button id=no>إلغاء</button></div></div>`;m.style.display='flex';$('#no').onclick=()=>m.style.display='none';

function xtGo(r,nw,need,uc,cid){V.quiet=true;try{for(const c of need){const id=uid();put('cats',id,{name:'صنف '+c,code:c,grp:''});cid[c]=id}

let n=0;for(const k of ['pur','sal','ret']){const rows=[IMP[k].h,...(k=='pur'?r.P:k=='sal'?r.S:r.R)];if(rows.length<2)continue;const pr=impParse(k,rows);if(pr.err.length){const m=$('#m');m.innerHTML=`<div class="box wide"><h3>توقّف الاستيراد عند ${e(IMP[k].t)}</h3><p class=mut>تم استيراد المواد وما قبل هذا القسم. صحّح الأخطاء التالية:</p><div class=mvl>${pr.err.slice(0,30).map(x=>`<div class=kv><span>${e(x)}</span></div>`).join('')}</div><div class=row><button id=no>إغلاق</button></div></div>`;m.style.display='flex';$('#no').onclick=()=>m.style.display='none';return}impApply(k,pr.groups);n+=pr.groups.length}
render(true);toast('تم استيراد '+nw.length+' مادة و'+n+' فاتورة')}

const nd=Math.round((t0-f0)/864e5)+1;if(nd>1100)return '<p class=bad>الفترة طويلة جداً (الحد الأقصى حوالي 3 سنوات)</p>';

const best=A.reduce((m,a)=>a.net>m.net?a:m,A[0]),ch=(a,b)=>b>0?Math.round((a-b)/b*1000)/10:null,cn=ch(R.net,P.net),cp=ch(R.gp,P.gp);

const jNz=x=>String(x==null?'':x).toLowerCase().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
function jScore(q,i){const n=jNz(i.name),tk=q.split(' ').filter(Boolean);let b=0;for(const t of tk){if(/^\d+$/.test(t)&&(String(i.tag||'')==t||jNz(i.code)==t))b=Math.max(b,100)}
if(n==q)b=Math.max(b,90);else if(q&&n.includes(q))b=Math.max(b,70);else if(q&&q.includes(n)&&n.length>2)b=Math.max(b,60);
const hay=n+' '+jNz(i.code)+' '+(i.tag||'');if(tk.length&&tk.every(t=>hay.includes(t)))b=Math.max(b,50+Math.min(9,tk.length));return b}
function jCands(q){return Object.entries(D.items).map(([id,i])=>[id,jScore(q,i)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6)}
function jParse(txt){return String(txt||'').split(/[\n،,;؛]+/).map(x=>x.trim()).filter(Boolean).map(seg=>{let s=jNz(seg);const nums=s.match(/\d+(?:\.\d+)?/g)||[];if(!nums.length)return{t:seg,q:null,ch:null,c:[]};const last=nums[nums.length-1],p=s.lastIndexOf(last);let q=+last,rest=(s.slice(0,p)+' '+s.slice(p+last.length)).replace(/(الكميه|كميه|عدد|حبات|حبه|قطعه|قطع|الجرد|جرد)/g,' ').replace(/[=:×x]/g,' ').replace(/\s+/g,' ').trim();
if(!rest){return{t:seg,q,ch:null,c:[]}}const c=jCands(rest),ch=c.length&&c[0][1]>=50&&(c.length==1||c[0][1]>c[1][1])?c[0][0]:null;return{t:seg,q,ch,c:c.map(x=>x[0])}})}

<p id=admerr class=bad style="min-height:1em;margin:6px 2px"></p><div class=btns><button class=pri data-a=admlogin>دخول</button><button data-a=tab data-id=home>رجوع</button></div>

async function doLogin(){const a=ACC();if(!a)return;if(Date.now()<lockUntil)return err('محاولات كثيرة غلط — استنى '+Math.ceil((lockUntil-Date.now())/1000)+' ثانية');

if(nu(u)==nu(a.u)&&await H(p)==a.h){fails=0;V.admOk=true;V.admv={};V.admf=null;toast('أهلاً '+a.u);render(true);return}
fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}err('اسم المستخدم أو كلمة المرور غلط');if(V.admv)V.admv.admp='';V.admf='admp';const x=$('#admp');if(x){x.value='';x.focus()}}
async function doCreate(){if(ACC())return render(true);const u=val('admu').trim(),p=val('admp').trim(),p2=val('admp2').trim();

admchg:()=>{const a=ACC();if(!a)return;ask('تأكيد كلمة المرور الحالية',[['p','كلمة المرور الحالية','password','']],async o=>{if(await H(o.p)!=a.h)return toast('كلمة المرور الحالية غلط');setNew('اسم مستخدم وكلمة مرور جديدة')})},
admforgot:async()=>{const rec=D.meta.pw&&D.meta.pw.h?D.meta.pw:(D.meta.lp&&D.meta.lp.h?D.meta.lp:null);if(!rec)return toast('ما في رمز ثاني للتحقق — تواصل مع الدعم');const ok=await pinVerify(D.meta.pw&&D.meta.pw.h?'أدخل رمز الأقسام لإعادة تعيين الحساب':'أدخل رمز دخول البرنامج لإعادة تعيين الحساب',rec);if(ok)setNew('إعادة تعيين حساب الإعدادات',()=>{V.admOk=true;render(true)})}
});
try{const k=T.findIndex(t=>t[0]=='set');if(k>=0&&!T[k].adm){const f=T[k][2];T[k][2]=()=>{if(!V.admOk){focus1();return loginPage()}return acctCard()+f()};T[k].adm=1}

const ot=A.tab;A.tab=d=>{if(V.tab=='set'&&d&&d.id!='set')V.admOk=false;return ot(d)};
for(const n of ['lock','logout']){const o=A[n];if(typeof o=='function')A[n]=(...x)=>{V.admOk=false;return o(...x)}}}catch(x){console.error('adm init',x)}

<script>/* v181: نسخة احتياطية حية على Firebase + تشغيل منه إذا وقف Supabase */
(function(){
const K='AIzaSyBhOpQYnTbqDBCUfb0c3_wG3y5tSZqR2Cg',P='posiyad-52ed7';
const ROOT='projects/'+P+'/databases/(default)/documents',API='https://firestore.googleapis.com/v1/';
const QK='fbq',AK='fbauth2',SK='fbseed';
let Q=[];try{Q=JSON.parse(localStorage.getItem(QK)||'[]')}catch(x){}
const st={run:false,last:+(localStorage.getItem('fblast')||0),err:'',seeding:false,seedN:0,seedT:0};
const qsave=()=>{try{localStorage.setItem(QK,JSON.stringify(Q))}catch(x){}};
const enc=id=>{let s=encodeURIComponent(String(id));if(s=='.'||s=='..')s=s.replace(/\./g,'%2E');return s};

const tmo=(ms)=>{const a=new AbortController();setTimeout(()=>a.abort(),ms);return a.signal};
async function tok(force){let a=null;try{a=JSON.parse(localStorage.getItem(AK)||'null')}catch(x){}
if(!force&&a&&a.id&&a.exp>Date.now()+60000)return a.id;
let r;if(a&&a.rt){r=await fetch('https://securetoken.googleapis.com/v1/token?key='+K,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.rt),signal:tmo(15000)}).then(x=>x.json());
if(r&&r.id_token){a={id:r.id_token,rt:r.refresh_token,exp:Date.now()+(+r.expires_in||3600)*1000};localStorage.setItem(AK,JSON.stringify(a));return a.id}}
const cf=(typeof sbCfg=='function'&&sbCfg())||{};if(!cf.email||!cf.pw)throw new Error('Firebase: لازم يكون البرنامج مربوط بحساب Supabase');const bd=JSON.stringify({email:cf.email,password:cf.pw,returnSecureToken:true}),IT='https://identitytoolkit.googleapis.com/v1/accounts:';r=await fetch(IT+'signInWithPassword?key='+K,{method:'POST',headers:{'Content-Type':'application/json'},body:bd,signal:tmo(15000)}).then(x=>x.json());if(r&&r.error&&/EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD/.test(r.error.message||'')){const r2=await fetch(IT+'signUp?key='+K,{method:'POST',headers:{'Content-Type':'application/json'},body:bd,signal:tmo(15000)}).then(x=>x.json());if(r2&&r2.idToken)r=r2;else if(r2&&r2.error&&r2.error.message=='EMAIL_EXISTS')throw new Error('Firebase: كلمة المرور مختلفة عن حساب Supabase');else if(r2&&r2.error)throw new Error('Firebase: '+r2.error.message)}
if(!r||!r.idToken)throw new Error((r&&r.error&&r.error.message)||'fb auth');
a={id:r.idToken,rt:r.refreshToken,exp:Date.now()+(+r.expiresIn||3600)*1000};localStorage.setItem(AK,JSON.stringify(a));return a.id}
async function req(path,opt,retry){const t=await tok(retry);opt=opt||{};opt.headers=Object.assign({},opt.headers||{},{'Content-Type':'application/json',Authorization:'Bearer '+t});opt.signal=opt.signal||tmo(30000);
const r=await fetch(API+path,opt);if((r.status==401||r.status==403)&&!retry)return req(path,Object.assign({},opt,{signal:null}),true);
if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(x){}throw new Error('Firebase '+r.status+(m?': '+m:''))}return r.json()}
const wr=op=>{const ts=String(op.ts||Date.now());return op.t=='del'?[{delete:dname(op.c,op.id)},{update:{name:ROOT+'/_del/'+enc(op.c+'|'+op.id),fields:{c:{stringValue:op.c},id:{stringValue:String(op.id)},ts:{integerValue:ts},u:{integerValue:ts}}}}]:[{update:{name:dname(op.c,op.id),fields:{d:{stringValue:JSON.stringify(op.o)},u:{integerValue:ts}}}}]};
async function commit(ops){return req(ROOT+':commit',{method:'POST',body:JSON.stringify({writes:ops.flatMap(wr)})})}
function batches(ops){const B=[];let cur=[],sz=0;for(const o of ops){const n=o.t=='del'?100:JSON.stringify(o.o).length+200;if(cur.length&&(cur.length>=240||sz+n>4e6)){B.push(cur);cur=[];sz=0}cur.push(o);sz+=n}if(cur.length)B.push(cur);return B}
window.fbMirror=op=>{if(!op||!okC(op.c)||(op.t!='set'&&op.t!='del'))return;const i=Q.findIndex(x=>x.c==op.c&&x.id==op.id);if(i>=0)Q.splice(i,1);Q.push({t:op.t,c:op.c,id:String(op.id),o:op.t=='set'?op.o:undefined,ts:op.ts||Date.now()});qsave();clearTimeout(st.tm);st.tm=setTimeout(fbFlush,1500)};
async function fbFlush(){if(st.run||!Q.length||!navigator.onLine)return;st.run=true;
try{while(Q.length){const part=batches(Q.slice(0,400))[0];await commit(part);
const done=new Set(part);Q=Q.filter(x=>!done.has(x));qsave();st.last=Date.now();localStorage.setItem('fblast',String(st.last));st.err=''}}
catch(x){st.err=x.message||String(x)}finally{st.run=false}}
window.fbFlush=fbFlush;window.__fbx={req,ROOT,enc,Q:()=>Q};
window.fbDiag=async()=>{const o={q:Q.length,err:st.err,last:st.last};const t0=performance.now();o.seed=await seedDone();o.rt=Math.round(performance.now()-t0);if(o.seed<0)return o;const bad=[];let tot=0;for(const c of Object.keys(D)){if(!okC(c))continue;const r=await req(ROOT+':runAggregationQuery',{method:'POST',body:JSON.stringify({structuredAggregationQuery:{structuredQuery:{from:[{collectionId:c}]},aggregations:[{alias:'n',count:{}}]}})});const a=r&&r[0]&&r[0].result&&r[0].result.aggregateFields;const n=+(a&&a.n&&a.n.integerValue||0);tot+=n;const loc=Object.keys(D[c]||{}).length;if(n!==loc)bad.push(c+' fb='+n+' local='+loc)}o.bad=bad;o.tot=tot;return o};
async function seedDone(){try{const r=await req(ROOT+'/_sys/seed',{method:'GET'});return r&&r.fields?+(r.fields.ts&&r.fields.ts.integerValue||1):0}catch(x){return/404/.test(x.message)?0:-1}}
async function fbSeed(manual){if(st.seeding)return;st.seeding=true;st.err='';try{
const ops=[];for(const c of Object.keys(D))if(okC(c))for(const [id,o] of Object.entries(D[c]||{}))ops.push({t:'set',c,id:String(id),o});
st.seedT=ops.length;st.seedN=0;rr();
for(const b of batches(ops)){await commit(b);st.seedN+=b.length;rr()}
await req(ROOT+':commit',{method:'POST',body:JSON.stringify({writes:[{update:{name:ROOT+'/_sys/seed',fields:{ts:{integerValue:String(Date.now())},n:{integerValue:String(ops.length)}}}}]})});
localStorage.setItem(SK,String(Date.now()));st.last=Date.now();localStorage.setItem('fblast',String(st.last));
if(manual)toast('تم رفع كل البيانات على Firebase ('+ops.length+' سجل)')}
catch(x){st.err=x.message||String(x);if(manual)toast('تعذر الرفع على Firebase: '+st.err)}finally{st.seeding=false;rr()}}
const rr=()=>{if(V.tab=='set'&&V.admOk)render(true)};
let sdP=null;window.fbLoad=async c=>{if(!okC(c)||!navigator.onLine)return null;if(!sdP)sdP=seedDone();const s=await sdP;if(s<=0){sdP=null;return null}
const m=new Map();let pt='';for(let g=0;g<200;g++){const r=await req(ROOT+'/'+c+'?pageSize=300&mask.fieldPaths=d'+(pt?'&pageToken='+encodeURIComponent(pt):''),{method:'GET',signal:tmo(20000)});
(r.documents||[]).forEach(d=>{try{m.set(decodeURIComponent(d.name.split('/').pop()),JSON.parse(d.fields.d.stringValue))}catch(x){}});if(!r.nextPageToken)break;pt=r.nextPageToken}
if(!window.__fbw){window.__fbw=1;setTimeout(()=>toast('⚠ Supabase لا يستجيب — البرنامج شغال من نسخة Firebase'),900)}return m};
async function boot(){try{if(!(window.SBR&&window.SBR.cl)||window.SBOFF||!V.mr||!navigator.onLine)return setTimeout(boot,20000);
if(!localStorage.getItem(SK)){const s=await seedDone();if(s>0)localStorage.setItem(SK,String(s));else if(s==0)await fbSeed(false);else return setTimeout(boot,60000)}}catch(x){setTimeout(boot,60000)}}
setTimeout(boot,25000);setInterval(fbFlush,20000);window.addEventListener('online',()=>setTimeout(fbFlush,3000));

<script>/* v183: مطابقة تلقائية بين Supabase و Firebase — أي جهاز بيرحّل الناقص من خادم للثاني */

async function fChanges(x,since){const out=[];for(const c of [...Object.keys(D).filter(okC),'_del']){let start=null;

else{let data=null;try{data=JSON.parse(f.d.stringValue)}catch(e){continue}put(F,c+'|'+decodeURIComponent(d.name.split('/').pop()),{c,id:decodeURIComponent(d.name.split('/').pop()),data,ts})}}
const pend=new Set([...sbQ.q,...x.Q()].filter(o=>o&&o.c).map(o=>o.c+'|'+o.id));

else if(s)toF.push(s);else toS.push(f)}

if(o.del){r=await R.cl.from('kv').delete().eq('coll',o.c).eq('id',o.id);if(!r.error)r=await R.cl.from('kv').upsert({coll:'_del',id:o.c+'|'+o.id,data:{c:o.c,id:o.id,ts:o.ts},updated_at:iso})}

if(fixed){st.fixed+=fixed;localStorage.setItem(FK,String(st.fixed))}
if(manual||toS.length)toast(fixed?'تمت المطابقة بين الخادمين — انرحّل '+fixed+' سجل':'الخادمين متطابقين ✓')}
catch(e){st.err=e.message||String(e);if(manual)toast('تعذرت المطابقة: '+st.err)}finally{st.run=false;if(V.tab=='set'&&V.admOk)render(true)}}

<script>/* v186: باركود ملصقات أوضح (رمز البطاقة + عرض بنقاط الطابعة) وصوت عند قراءة الكاميرا */
(function(){
function enc(s){const out=[];let set=null,i=0;const isD=j=>j<s.length&&s.charCodeAt(j)>=48&&s.charCodeAt(j)<=57;
const run=j=>{let k=j;while(isD(k))k++;return k-j};
const toB=()=>{if(set!=='B'){out.push(set===null?104:100);set='B'}},toC=()=>{if(set!=='C'){out.push(set===null?105:99);set='C'}};
while(i<s.length){const r=run(i);
if(r>=4||(r>=2&&i==0&&r==s.length&&r%2==0)){let n=r;if(n%2){toB();out.push(s.charCodeAt(i)-32);i++;n--}toC();for(let k=0;k<n;k+=2){out.push(+s.substr(i,2));i+=2}}
else{toB();out.push(s.charCodeAt(i)-32);i++}}
let sum=out[0];for(let j=1;j<out.length;j++)sum+=j*out[j];out.push(sum%103,106);return out}
window.bc128enc=enc;
window.bcSvg=(s,f,c)=>{f=f||{};c=c||{w:50,pad:0};const P=enc(String(s)).map(x=>C128[x]);let m=10;for(const p of P)for(const ch of p)m+=+ch;
const dpi=+f.dpi||203,dot=25.4/dpi,avail=Math.max(5,((+c.w||50)-2*(+c.pad||0))*((+f.wp||100)/100)),k=Math.floor(avail/(m*dot)),wmm=k>=1?m*k*dot:avail;
let x=5,r='';for(const p of P)for(let q=0;q<p.length;q++){const w=+p[q];if(q%2==0)r+=`<rect x="${x}" y="0" width="${w}" height="10"/>`;x+=w}
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${m} 10" preserveAspectRatio="none" style="width:${wmm.toFixed(3)}mm;height:${+f.h||10}mm;display:block;margin:.4mm auto;shape-rendering:crispEdges;flex:none" fill="#000">${r}</svg>`};
let ac=null;const get=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume()}catch(x){}return ac};
